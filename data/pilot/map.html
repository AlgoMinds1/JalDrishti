<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JalDrishti pilot replay</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>html,body,#map{height:100%;margin:0;font:14px system-ui}#bar{position:absolute;z-index:1000;top:10px;left:55px;right:10px;background:#fff;padding:10px 14px;border-radius:8px;box-shadow:0 1px 6px #555}#map{height:100%}.road{color:#0072B2} .low{color:#009E73}.moderate{color:#E69F00}.high{color:#D55E00}.severe{color:#CC79A7}</style></head><body><div id="bar"><strong>Decision-support prototype, not an official emergency service. Replay of a past event</strong><br>Rainfall near zero in the available forecast snapshot. All outputs are a low-confidence threshold baseline. Horizon: <input id="slider" type="range" min="1" max="6" value="1"><b id="h">+1 h</b></div><div id="map"></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>const map=L.map('map').setView([18.492,73.825],13);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap contributors'}).addTo(map);let layer;async function show(h){document.getElementById('h').textContent='+'+h+' h';const r=await fetch('predictions_h'+h+'.geojson');const data=await r.json();if(layer)map.removeLayer(layer);layer=L.geoJSON(data,{style:f=>({color:({low:'#009E73',moderate:'#E69F00',high:'#D55E00',severe:'#CC79A7'})[f.properties.risk_class]||'#0072B2',weight:4,opacity:.55}),onEachFeature:(f,l)=>{const p=f.properties;l.bindPopup(`<b>${p.road_name}</b><br>Risk: ${p.risk_class}<br>Probability: ${p.probability}<br>Confidence: ${p.confidence}<br>Rain next hour: ${p.rain_next_h_mm} mm<br>Reasons: ${p.top_reasons.join('; ')}<br>Generated: ${p.generated_at}<br>Rain data: ${p.rain_data_timestamp}`)}}).addTo(map)}document.getElementById('slider').oninput=e=>show(e.target.value);show(1);</script></body></html>
